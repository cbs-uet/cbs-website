<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBS Domain</title>
    <style>
        *{ padding:0; margin:0; box-sizing:border-box; }
        body{ font-family: Arial, sans-serif; background:#fffbe6; color:#2b2b2b; }

        .top{
            background: linear-gradient(135deg, #064e3b, #0b6b4f);
            color: white;
            text-align: center;
            padding: 70px 20px 60px;
        }
        .top .icon{ font-size: 4rem; display:block; }
        .top h1{ font-size: 2.4rem; margin-top: 10px; }
        .top p{ color:#fde68a; margin-top: 10px; letter-spacing: 2px; }

        .content{ max-width: 850px; margin: 40px auto; padding: 0 20px; }
        .content h2{ color:#064e3b; margin: 30px 0 15px; }
        .content p{ line-height: 1.8; font-size: 1.1rem; }

        ul{ list-style:none; }
        li{
            background:white;
            padding:14px 18px;
            margin-bottom:12px;
            border-left:5px solid #e6a100;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }

        .btn{
            display:inline-block;
            margin-top:30px;
            padding:12px 28px;
            background:#064e3b;
            color:white;
            text-decoration:none;
            border-radius:30px;
        }
        .btn:hover{ background:#e6a100; color:#3b2f05; }
    </style>
</head>
<body>

    <div class="top">
        <span class="icon" id="icon"></span>
        <h1 id="title"></h1>
        <p>CHARACTER BUILDING SOCIETY</p>
    </div>

    <div class="content">
        <h2>Purpose</h2>
        <p id="about"></p>

        <h2>What We Do?</h2>
        <ul id="tasks"></ul>

        <a href="index.html#domains" class="btn">← Back to Domains</a>
    </div>

    <script>
      const domains = {
            events: {
                icon: "🎪", title: "Events & Management",
                about: "The Events and management Domain is responsible for planning,organizing,coordinating and managing CBS Events and activities.it ensures that every program is conducted professionally,efficiently, and in accordance with society's mission.",
                tasks: ["Plan and organize seminars,workshops,oath taking ceremonies,awareness sessions and  student activities. ", "Prepare event schedules,task assignments,checklists, and timetables ", "Coordinate with faculty members,speakers,guests,volunteers,and other Cbs domains.","Managing events logistics,including venues","seating,registration,equipment, and arrangements"]
            },
            academic: {
                icon: "🎓", title: "Academic & Welfare",
                about: "The Academic & Welfare Domain supports in achieving their educational goals while promoting their economic ,academic and social well beings.It aims to create a supportive university environment where they can learn,develope and succeed.",
                tasks: ["Organizing academic webinars ,study sessions,monitoring activities,and skill-development workshops.", "Share information about scholarships ,internships,research opportunities, and educational resources.", "Encourage peer learning and collaboration among students from different departments.","Identify common student concerns and communicate them to the relavent university authorities.","Promotes student well-being,inclusion,mutual support and positive learning environment."]
            },
            media: {
                icon: "📸", title: "Media",
                about: " The media Domain manages CBS's public communication ,digital presence,event coverage and publication activities.It documents society work and communicates its mission,achievments, and opportunities to the university community.",
                tasks: ["Maintain and update CBS social media platforms and digital communication channels", "Cover official events through photography ,videography,interviews and events highlights.", "Produce reels,short videos,posters,announcements,and other professional content.","Publish reports,newsletters,articles,and summaries of society activities."]
            },
            finance: {
                icon: "💰", title: "Finance",
                about: "The Finance Domain supports the responsible financial management of CBS activities.It helps ensure that approved funds,if any, are pleased ,recorded,monitored,and used transparantely for legaments for legitimate Society purposes.",
                tasks: ["Prepare events budgets and estimated expenditure plans", "Maintain accurate records of approved income,expenses, and available funds", "Document financial transactions and retain reciepts  or supporting evidence."," Montor expenditure againstapproved budget."]
            },
            record: {
                icon: "📋", title: "Record",
                about: "The record Domain maintains the societies official documentation and information. It ensures that CBS activities,memberships,meetings, decisions and achievements are documented accurately and can be retrieved when required.",
                tasks: ["Maintain updated membership and volunteers records.", "Document meeting minutes, decision,attendance, and the official proceedings.", "Maintain Events reports,activity summaries,and historical records.","Organize official documents in structured digital or physical archives."]
            },
            islamic: {
                icon: "🕌", title: "Islamic",
                about: "The Islamic Domain promotes Islamic values,ethical character,spiritual awareness, and positive conducts among students.it seeks to encourage honesty, compassion,discipline,humanity,and service yo humanity through educational and constructive activities.",
                tasks: ["Organize Islamic awareness sessions,educational talks and discussion with qualified speakers.", "Promotes the values of honesty,respect,patience and compassion.", "Encourage Khidmate-e-Khalq as an expression of good deed."," Coordinate educational initiatives with appropriate faculty members and qualified religious scholar"]
            },
            volunteer: {
                icon: "🤝", title: "Volunteer Management",
                about: "The Volunteer Management Domain recruits,coordinates,supports,and develops CBS volunteers.It ensures that students are assigned meaningful responsibilities and that volunteer participation contributes efficiently to society activities.",
                tasks: ["Maintain an updated database of CBS volunteers", " .", "Encourage teamwork, punctuality,discipline and accountability."," Maintain attendance Participation, and contribution records."]
            },
            electronics: {
                icon: "🏛️", title: "Inter Dept ",
                about: "The Inter-Department Electronics Domain serves as a coordinates link between CBS and students of Electronics Engineering.It encourages departmental participation in society activities while promoting ethical engineering,technical learning, teamwork and collaboration across disciplines.",
                tasks: ["Communicate CBS announcements, opportunities,  and activities to Electronics Engineering students.", "Encourage departmental representative in events, webinars, and volunteer initiatives.", "Facilities technical awareness sessions and opportunities for interdisciplinary learning.","Identify students interests and academic-development needs within department."]
            }
        };

        const key = new URLSearchParams(window.location.search).get("d");
        const data = domains[key];

        if (data) {
            document.title = data.title + " | CBS";
            document.getElementById("icon").textContent = data.icon;
            document.getElementById("title").textContent = data.title;
            document.getElementById("about").textContent = data.about;
            data.tasks.forEach(t => {
                const li = document.createElement("li");
                li.textContent = t;
                document.getElementById("tasks").appendChild(li);
            });
        } else {
            document.getElementById("title").textContent = "Domain not found";
        }
    </script>
</body>
</html>
